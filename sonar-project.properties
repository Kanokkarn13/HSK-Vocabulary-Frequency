sonar.organization=kanokkarn13
sonar.projectKey=Kanokkarn13_HSK-Vocabulary-Frequency
sonar.sources=backend,etl,frontend/src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.exclusions=notebooks/**,data/**,tests/**,frontend/src/**/*.test.tsx,frontend/src/test-setup.ts
# Orchestration/integration glue is exercised by Airflow and database smoke
# checks; keep it in source and security analysis without diluting unit-test
# coverage of the transformation and validation logic.
sonar.coverage.exclusions=etl/manifest.py,etl/stage_database.py,etl/transform_batch.py,etl/pipeline.py,etl/batch_gate.py
